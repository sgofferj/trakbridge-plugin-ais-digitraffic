name: Build Release Package

on:
  push:
    branches:
      - 'release-**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: pip install poetry pyyaml
      - name: Install dependencies
        run: poetry install
      - name: Lint
        run: |
          poetry run black --check plugin/ || true
          poetry run mypy plugin/ || true
          poetry run pylint plugin/ || true
      - name: Test
        run: poetry run pytest || true
      - name: Build plugin package
        run: python scripts/package_release.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-package
          path: dist/
